<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffd9a0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Talking Pets">
  <title>Talking Pets</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="picker" class="screen picker">
    <h1>Talking Pets</h1>
    <div id="pet-grid" class="pet-grid"></div>
  </main>

  <main id="stage" class="screen stage" hidden>
    <header class="top">
      <button id="change-pet" class="chip" type="button" aria-label="Choose another pet">‹ 🐾</button>
      <h2 id="pet-name"></h2>
      <span class="chip-spacer"><span id="mic-dot" class="mic-dot" hidden>🎤</span></span>
    </header>
    <div id="hud" class="hud" hidden>
      <span class="hud-score">⭐ <b id="hud-score">0</b></span>
      <span class="hud-time"><i id="hud-time"></i></span>
      <button id="hud-quit" class="chip" type="button" aria-label="Stop the game">✖</button>
    </div>
    <div id="pet-holder" class="pet-holder"></div>
    <div id="mic-notice" class="mic-notice" hidden>
      <span>The microphone is off, so your pet can't hear you. Taps and games still work.</span>
      <button id="mic-retry" class="chip" type="button">Turn on microphone</button>
    </div>
    <nav class="actions">
      <button type="button" data-action="feed" aria-label="Feed"><span class="emoji" id="feed-emoji">🍽️</span><span class="label">Feed</span></button>
      <button type="button" data-action="milk" aria-label="Milk"><span class="emoji">🥛</span><span class="label">Milk</span></button>
      <button type="button" data-action="ball" aria-label="Ball"><span class="emoji">⚽</span><span class="label">Ball</span></button>
      <button type="button" data-action="pie" aria-label="Pie"><span class="emoji">🥧</span><span class="label">Pie</span></button>
      <button type="button" class="game" data-game="swing" aria-label="Swing game"><span class="emoji">🎠</span><span class="label">Swing</span></button>
      <button type="button" class="game" data-game="boxing" aria-label="Boxing game"><span class="emoji">🥊</span><span class="label">Boxing</span></button>
      <button type="button" data-action="trampoline" aria-label="Trampoline"><span class="emoji">🤸</span><span class="label">Jump</span></button>
      <button type="button" data-action="bubbles" aria-label="Bubbles"><span class="emoji">🫧</span><span class="label">Bubbles</span></button>
      <button type="button" data-action="dance" aria-label="Dance"><span class="emoji">🎵</span><span class="label">Dance</span></button>
      <button type="button" data-action="toot" aria-label="Toot"><span class="emoji">💨</span><span class="label">Toot</span></button>
      <button type="button" id="dress" aria-label="Dress up"><span class="emoji">🎩</span><span class="label">Dress up</span></button>
      <button type="button" id="sleep" aria-label="Sleep"><span class="emoji" id="sleep-emoji">🌙</span><span class="label">Sleep</span></button>
    </nav>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
