<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffd9a0">
  <title>Talking Pets</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="picker" class="screen picker">
    <h1>Talking Pets</h1>
    <p class="lead">Pick a pet. It repeats everything you say.</p>
    <div id="pet-grid" class="pet-grid"></div>
    <p class="fine">No ads. Nothing you say leaves this device.</p>
  </main>

  <main id="stage" class="screen stage" hidden>
    <header class="top">
      <button id="change-pet" class="chip" type="button">‹ Pets</button>
      <h2 id="pet-name"></h2>
      <span class="chip-spacer"></span>
    </header>
    <p id="status" class="status" aria-live="polite"></p>
    <div id="pet-holder" class="pet-holder"></div>
    <div id="mic-notice" class="mic-notice" hidden>
      <span>The microphone is off, so your pet can't hear you. Taps and treats still work.</span>
      <button id="mic-retry" class="chip" type="button">Turn on microphone</button>
    </div>
    <nav class="actions">
      <button type="button" data-action="feed"><span class="emoji" id="feed-emoji">🍽️</span>Feed</button>
      <button type="button" data-action="milk"><span class="emoji">🥛</span>Milk</button>
      <button type="button" data-action="ball"><span class="emoji">⚽</span>Ball</button>
      <button type="button" data-action="pie"><span class="emoji">🥧</span>Pie</button>
      <button type="button" data-action="dance"><span class="emoji">🎵</span>Dance</button>
      <button type="button" data-action="toot"><span class="emoji">💨</span>Toot</button>
      <button type="button" id="dress"><span class="emoji">🎩</span>Dress up</button>
      <button type="button" id="sleep"><span class="emoji" id="sleep-emoji">🌙</span><span id="sleep-label">Sleep</span></button>
    </nav>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
